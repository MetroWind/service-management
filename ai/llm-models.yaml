    - name: Download qwen3.8 27B mmproj
      ansible.builtin.command:
        argv:
          - wget
          - "-c"
          - "-O"
          - "/mnt/data/models/llm/qwen3.8-27b-mmproj-bf16.gguf"
          - "https://huggingface.co/huihui-ai/Huihui-Qwen3.8-27B-abliterated-GGUF/resolve/main/mmproj-model-bf16.gguf"
