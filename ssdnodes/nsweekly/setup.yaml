- name: Build NSWeekly
  hosts: ssh.mws.rocks
  tasks:
    - name: Download source
      ansible.builtin.git:
        repo: https://github.com/MetroWind/nsweekly.git
        dest: /tmp/nsweekly

    - name: Build package
      ansible.builtin.command:
        cmd: makepkg -sr --noconfirm -f
        chdir: "/tmp/nsweekly/packages/arch"
        creates: "/tmp/nsweekly/packages/arch/nsweekly-git-*-x86_64.pkg.tar.zst"

    - name: What package did I build?
      register: package_file_proc
      ansible.builtin.shell:
        cmd: "ls -1 nsweekly-git-*-x86_64.pkg.tar.zst"
        chdir: "/tmp/nsweekly/packages/arch"

    - set_fact:
        package_file: "{{ package_file_proc.stdout }}"

    - debug:
        msg: "Built package {{ package_file }}"

- name: Build NSWeekly
  hosts: ssh.mws.rocks
  become: yes
  vars:
    client_secret: !vault |
          $ANSIBLE_VAULT;1.1;AES256
          31363535326365656465396561363636376134643331356139346435636237396432396536643935
          3332353533336163343534646464323165376238393236620a613766306139383730346565306237
          34633039616365626561633736636665636139386164633333653133393962353537656533383137
          6439383837633062380a643833346461613461656665393263346633323437336235366166323966
          30313639363062643166326464343938366163316436356163363133616438376637323163353035
          3663303635623037653230326462323261666662303832363339
  tasks:
    - name: Install package
      community.general.pacman:
        name:
          - "/tmp/nsweekly/packages/arch/{{ package_file }}"
        state: present

    - name: Copy config
      ansible.builtin.template:
        src: config.yaml
        dest: /etc/nsweekly.yaml
        group: nsweekly
        owner: nsweekly
        mode: 0600

    - name: Copy Apache config
      ansible.builtin.copy:
        src: apache.conf
        dest: /etc/httpd/conf/vhosts/nsweekly.conf

    - name: Enable vhost
      ansible.builtin.lineinfile:
        path: /etc/httpd/conf/httpd.conf
        regexp: '^#Include\s+conf/vhosts/nsweekly\.conf'
        insertafter: "Probably not exists"
        line: 'Include conf/vhosts/nsweekly.conf'

    - name: Restart Apache
      ansible.builtin.systemd:
        state: restarted
        name: httpd
        enabled: yes

    - name: Make sure service is running and enabled
      ansible.builtin.systemd:
        state: restarted
        name: nsweekly
        enabled: yes
        daemon_reload: yes

    - name: Remove package dir
      ansible.builtin.file:
        path: /tmp/nsweekly
        state: absent
