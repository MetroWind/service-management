<VirtualHost *:80>
    ServerName nethack.mws.rocks
    # For Let's Encrypt challenge.
    RewriteEngine on
    RewriteRule "^/.well-known/acme-challenge/(.+)" "http://mws.rocks/.well-known/acme-challenge/$1" [R,L]

    RewriteRule "^/(.*)$" "https://nethack.mws.rocks/$1" [R=301,L,NE]
</VirtualHost>

<VirtualHost *:443>
    ServerName nethack.mws.rocks
    SSLEngine on
    RewriteEngine on

    ProxyPreserveHost On
    ProxyPass "/" "unix:/run/nethack-mcp/network.sock|http://localhost/" nocanon
    ProxyPassReverse "/" "unix:/run/nethack-mcp/network.sock|http://localhost/"
</VirtualHost>
