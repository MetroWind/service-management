<VirtualHost *:80>
  ServerName forum.mws.rocks
  # For Let's Encrypt challenge.
  RewriteEngine on
  RewriteRule "^/.well-known/acme-challenge/(.+)" "http://mws.rocks/.well-known/acme-challenge/$1"  [R,L]
  Redirect permanent / https://forum.mws.rocks/
</VirtualHost>

<VirtualHost *:443>
  ServerName forum.mws.rocks
  DocumentRoot /srv/http/forum
  SSLEngine on
  <Directory "/srv/http/forum">
      Options FollowSymLinks
      AllowOverride None
      AuthType Basic
      AuthName "If you are not a bot, use username nobot, password nobot."
      AuthBasicProvider file
      AuthUserFile /etc/httpd/forum.htpasswd
      Require valid-user
  </Directory>
  ErrorDocument 401 "If you are not a bot, use username nobot, password nobot. If you cancelled the login prompt, reload this page to try again."
</VirtualHost>
