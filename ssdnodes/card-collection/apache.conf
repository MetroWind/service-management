<VirtualHost *:80>
    ServerName cards.mws.rocks
    # For Let's Encrypt challenge.
    RewriteEngine on
    RewriteRule "^/.well-known/acme-challenge/(.+)" "http://mws.rocks/.well-known/acme-challenge/$1" [R,L]

    RewriteRule "^/(.*)$" "https://cards.mws.rocks/$1" [R=301,L,NE]
</VirtualHost>

<VirtualHost *:443>
    ServerName cards.mws.rocks
    SSLEngine on
    RewriteEngine on

    ProxyPreserveHost On
    ProxyPass "/static-cards/" "!"
    Alias "/static-cards/" "/var/lib/card-collection/cards/published/"

    <Directory "/var/lib/card-collection/cards/published">
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    ProxyPass "/" "unix:/var/run/card-collection/network.sock|http://localhost/" nocanon
    ProxyPassReverse "/" "unix:/var/run/card-collection/network.sock|http://localhost/"
</VirtualHost>
