<VirtualHost *:80>
    ServerName naivelysimple.org
    DocumentRoot /srv/http/naivelysimple

    RewriteEngine on
    RewriteRule "^/.well-known/acme-challenge/(.+)" \
        "http://mws.rocks/.well-known/acme-challenge/$1" [R,L]

    <Directory "/srv/http/naivelysimple">
        Options FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>

<VirtualHost *:443>
    ServerName naivelysimple.org
    DocumentRoot /srv/http/naivelysimple
    SSLEngine on

    <Directory "/srv/http/naivelysimple">
        Options FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
