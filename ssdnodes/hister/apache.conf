<VirtualHost *:80>
    ServerName {{ hister_domain }}
    RewriteEngine on
    # Use the existing ACME challenge host.
    RewriteRule "^/.well-known/acme-challenge/(.+)" "http://mws.rocks/.well-known/acme-challenge/$1" [R,L]
    RewriteRule "^/(.*)$" "https://{{ hister_domain }}/$1" [R=301,L,NE]
</VirtualHost>

<VirtualHost *:443>
    ServerName {{ hister_domain }}
    # Inherit the shared certificate configured on ssh.mws.rocks.
    SSLEngine on
    ProxyRequests Off
    ProxyPreserveHost On
    RewriteEngine on
    RequestHeader set X-Forwarded-Proto "https"
    LimitRequestBody 104857600
    ProxyPass / http://127.0.0.1:4433/ upgrade=websocket timeout=86400
    ProxyPassReverse / http://127.0.0.1:4433/
</VirtualHost>
