<VirtualHost *:443>
    ServerName xeno.darksair.org
    SSLCertificateFile /etc/letsencrypt/live/xeno.darksair.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/xeno.darksair.org/privkey.pem

    ProxyPreserveHost On
    RewriteEngine on
    ProxyPass / "unix:/run/probius/probius.sock|http://127.0.0.1/" nocanon
    ProxyPassReverse / "unix:/run/probius/probius.sock|http://127.0.0.1/"
</VirtualHost>
