<VirtualHost *:80>
    ServerName files.xeno.darksair.org
    Redirect permanent / https://files.xeno.darksair.org/
</VirtualHost>
<VirtualHost *:443>
    ServerName files.xeno.darksair.org
    SSLCertificateFile /etc/letsencrypt/live/xeno.darksair.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/xeno.darksair.org/privkey.pem
    SSLEngine on

    # Apply global rewrite rules.
    RewriteEngine on
    ProxyPreserveHost On
    HostnameLookups Off
    UseCanonicalName Off
    Header always set Access-Control-Allow-Origin "*"
    ProxyPass / http://adenine.xeno:61142/ nocanon
    ProxyPassReverse / http://adenine.xeno:61142/
</VirtualHost>
